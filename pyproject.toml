# Entorno exacto con que se obtuvieron los resultados del libro. Las
# versiones van CLAVADAS, no acotadas: el lock se congela desde el entorno
# que generó los números (conda `envDSPy`), no desde uno limpio.
[project]
name = "prompts-con-dspy"
version = "1.0.1"
description = "Código reproducible de «Programación de prompts con DSPy»"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Manuel Muñoz Plá" }]

dependencies = [
  "dspy==3.2.1",
  "numpy==2.3.3",
  "pydantic==2.12.4",           # firmas y salidas tipadas
  "python-dotenv==1.2.2",
  "scikit-learn==1.7.2",        # métricas y particiones estratificadas
  "rank-bm25==0.2.2",           # recuperación léxica del RAG (cap. 7)
  "datasets==4.4.1",            # corpus de arXiv y CSIC 2010
  "transformers==4.57.1",       # tokenizador y embeddings
  "torch==2.11.0",              # rueda cu130 (Blackwell)
]

# El servidor NO se declara aquí: vLLM 0.24.0 sirve Qwen2.5-7B-Instruct como
# proceso aparte —el código habla con su API, no lo importa— y su rueda
# depende de la GPU. Ver «Ejecutar el código» en el README.

[project.urls]
Libro = "https://manpla.net/libros/prompts-con-dspy/"
Repositorio = "https://github.com/mmunozpl/PromptsConDSPy"

[tool.uv]
# La instalación es ADITIVA cuando el entorno conda se comparte con otros
# proyectos:  uv pip install -r <(uv export --no-hashes --no-dev)
# `uv sync` NO se usa ahí: eliminaría todo paquete no declarado aquí.
package = false
